<!-- public/listings.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Listings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind CSS -->
  </head>
  <body class="bg-gray-50 font-sans">
    <header class="bg-green-600 text-white py-6">
      <div class="container mx-auto text-center">
        <h1 class="text-3xl font-bold">All Listings</h1>
      </div>
    </header>

    <main class="py-12">
      <div class="container mx-auto">
        <!-- This is where the listings will be dynamically displayed -->
        <div id="listings" class="space-y-6">
          <!-- Listings will be inserted here -->
        </div>
      </div>
    </main>

    <footer class="bg-gray-800 text-white py-6">
      <div class="container mx-auto text-center">
        <p>&copy; 2025 HousingPanda</p>
      </div>
    </footer>

    <script>
      // Fetch listings from the backend API
      fetch("/api/listings")
        .then((response) => response.json())
        .then((listings) => {
          const listingsContainer = document.getElementById("listings");
          listings.forEach((listing) => {
            const listingDiv = document.createElement("div");
            listingDiv.classList.add(
              "bg-white",
              "p-6",
              "rounded-lg",
              "shadow-md"
            );

            listingDiv.innerHTML = `
                        <h2 class="text-xl font-semibold text-gray-800">${listing.title}</h2>
                        <p class="text-gray-600">${listing.description}</p>
                        <p class="font-bold text-gray-800">Rent: $${listing.rent} | Rooms: ${listing.rooms}</p>
                        <p class="text-gray-600">Address: ${listing.address}</p>
                        <p class="text-gray-600">Contact: ${listing.contact_info}</p>
                    `;

            listingsContainer.appendChild(listingDiv);
          });
        })
        .catch((error) => {
          console.error("Error fetching listings:", error);
        });
    </script>
  </body>
</html>
